name: Build Windows release
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: glass-frontend/package-lock.json
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build and verify no-reference package
        shell: pwsh
        run: ./tools/build-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BoyiStudio-windows-x64-no-references
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
